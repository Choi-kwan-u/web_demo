name: collect

on:
  schedule:
    - cron: "17 */6 * * *"      # 6시간마다 (UTC). 정각은 붐비니 17분으로
  workflow_dispatch:            # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write               # data/ 커밋에 필요

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 수집
        run: python collector/fetch.py

      - name: 변경분 커밋
        run: |
          git config user.name  "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
